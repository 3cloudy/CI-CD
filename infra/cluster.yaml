apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ankush-cluster
  region: ap-south-1
  version: "1.37"

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: frontend-nodes
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
    labels:
      role: frontend
