apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: 967618591568.dkr.ecr.ap-south-1.amazonaws.com/ankush-frontend:v1
          ports:
            - containerPort: 80
